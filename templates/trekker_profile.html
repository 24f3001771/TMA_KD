{% extends "trekker_base.html" %}

{% block title %}
Profile
{% endblock %}

{% block header_title %}
My Profile
{% endblock %}

{% block content %}
<div class="card p-4 mb-4">
    <h3 class="text-center">Personal Information</h3>
    <hr>
    <p><strong>Name:</strong> {{user.full_name}}</p>
    <p><strong>Username:</strong> {{user.username}}</p>
    <p><strong>Email:</strong> {{user.email}}</p>
    <p><strong>Phone:</strong> {{user.phone}}</p>
    
    <div class="button" style="margin: 20px; display: flex; justify-content: center; align-items: end;">
        <a href="{{ url_for('edit_trekker_profile',user_id=user.id) }}" class="btn btn-outline-dark btn-lg">Edit</a>
    </div>

</div>
{% endblock %}
