<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        #main #heading {
            margin: auto;
            padding: 15px;
            border: 2px solid black;
            background-color: rgb(208, 205, 205);
        }

        .form-body {
            width: 500px;
            height: 450px;
            margin-left: 530px;
            margin-top: 37px;
            border: 1px solid black;
            border-radius: 5px;
        }

        .form-body div {
            padding: 10px;
        }

        .form-body h2 {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="heading">
            <h2>Trekking Management Application</h2>
        </div>
        <div class="form-body">
            <form action="/login" method="post">
                <h2>Login Form</h2>
                <div class="mb-3">
                    <label for="Input1" class="form-label">Username</label>
                    <input type="text" class="form-control" id="Input1" name="username" placeholder="Username">
                </div>
                <div class="mb-3">
                    <label for="Input2" class="form-label">Password</label>
                    <input type="password" class="form-control" id="Input2" name="password" placeholder="Password"><br>
                    <input class="form-check-input" type="checkbox" value="Remember" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">Remember me</label>
                </div>
                <div class="text-center">
                    <input type="submit" class="btn btn-primary" value="Login"><br>
                    Don't have an account? <a href="/signup">Register here</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
