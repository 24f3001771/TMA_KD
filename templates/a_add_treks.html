{% extends "base.html" %}

{% block title %}
Add/Edit Treks
{% endblock %}


{% block head_css %}
<style>
  .form-add-treks {
    box-sizing: border-box;
    height: 100vh;
    display: flex;
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    
  }

  .left , .right{
    flex:1;
  }
  .form-add-treks .left,.form-add-treks .right {
    height: 500px;
    
  }


  .left .l {
    margin: 20px;
    padding: 10px;
    margin-bottom:22px;
  }

  .right .r {
    margin: 20px;
    padding: 10px;
    margin-bottom:22px;
  }
  .r{
    display: flex;
    align-items:center;
    margin-bottom: 10px;
  }
  .r label{
    width: 150px;
    font-weight: 500;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  }
  .l{
    display: flex;
    align-items:center;
    margin-bottom: 10px;
  }
  .l label{
    width: 150px;
    font-weight: 500;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  }
  .r input,
  .r select{
    flex: 1;
  }
  .l input,
  .l select{
    flex: 1;
  }
  textarea{
    width: 100%;
    min-height:120px;
  }
</style>
{% endblock %}

{% block header_title %}
Add New Trek
{% endblock %}

{% block content %}

<form action="/admin/add_treks" class="form-add-treks" method="post">
  <div class="left">
    <div class="l">
      <label for="name">Trek Name</label>
      <input type="text" id="name" name="tname" required>
    </div>
    <div class="l">
      <label for="loc">Location</label>
      <input type="text" name="loc" id="loc">
    </div>
    <div class="l">
      <label for="level">Difficulty</label>
      <select name="values" id="level">
        <option value="easy">Easy</option>
        <option value="moderate">Moderate</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="l">
      <label for="duration">Duration(Days)</label>
      <input type="number" id="duration" name="duration" value="days">
    </div>
    <div class="l">
      <label for="slots">Maximum Slots</label>
      <input type="number" name="max slots" id="slots" value="no.ofslots">
    </div>
  </div>
  <div class="right">
    <div class="r">
      <label for="date">Start Date</label>
      <input type="date" name="starttime" id="date" placeholder="dd/mm/yyyy">
    </div>
    <div class="r">
      <label for="endtime">End Date</label>
      <input type="date" name="endtime" id="endtime" placeholder="dd/mm/yyyy">
    </div>
    <div class="r">
      <label for="assign_staff">Assign Staff</label>
      <select name="staff_ids" id="assign_staff" multiple size="2" style="height: 120px; width: 100%;">
        {% for staff in staffs %}
        <option value="{{staff.id}}">{{staff.user.username}} ({{ staff.expertise }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="r">
      <label for="status">Status</label>
      <select name="status" id="status">
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="open">Open</option>
        <option value="closed">Closed</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="r">
      <label for="message">Description</label>
      <textarea id="message" name="message" rows="4" ></textarea>
    </div>
  </div>
  <div class="buttons"
  style="gap: 15px; margin-top: 20px; align-self: flex-end; align-items:end;">
  <a href="/admin/treks" class="btn btn-danger">Cancel</a>
  <button type="submit" class="btn btn-success">Save</button>
</div>
</form>

{% endblock %}
