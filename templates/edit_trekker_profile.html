{% extends "trekker_base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block header_title %}
Edit Profile
{% endblock %}

{% block content %}
<div class="card shadow p-4">

    <h3>Edit Profile</h3>
    <hr>

    <form method="POST">
        <!-- fullname -->
        <div class="mb-3">
            <label class="form-label">FullName</label>
            <input
                type="text"
                class="form-control"
                name="full_name"
                value="{{ user.full_name }}"
                >
        </div>

        <!-- Username -->
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input
                type="text"
                class="form-control"
                value="{{ user.username }}"
                readonly>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input
                type="email"
                class="form-control"
                name="email"
                value="{{ user.email }}">
        </div>

        <!-- Contact -->
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input
                type="text"
                class="form-control"
                name="phone"
                value="{{ user.phone or '' }}">
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('trekker_profile',user_id=user.id) }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
